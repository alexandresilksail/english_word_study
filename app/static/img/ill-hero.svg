<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Learner studying English with headphones">
<defs>
<linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5efc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="hg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="hg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
</defs>
<rect width="520" height="420" rx="40" fill="#f1f0ff"/>
<circle cx="80" cy="60" r="120" fill="#6d5efc" opacity="0.10"/>
<circle cx="470" cy="390" r="140" fill="#22d3ee" opacity="0.12"/>
<circle cx="300" cy="30" r="7" fill="#fbbf24"/><circle cx="90" cy="200" r="5" fill="#8b5cf6"/><circle cx="470" cy="150" r="6" fill="#fb7185"/><circle cx="420" cy="300" r="5" fill="#34d399"/>

<!-- speech bubble -->
<g transform="translate(250 48)">
<rect x="0" y="0" width="128" height="56" rx="26" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
<path d="M28 52 L36 74 L60 52 Z" fill="#ffffff" stroke="#e0e7ff" stroke-width="2" stroke-linejoin="round"/>
<text x="64" y="34" text-anchor="middle" font-family="ui-rounded, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#6d5efc">Hello!</text>
</g>

<!-- floating word tile -->
<g transform="translate(26 70)">
<rect width="96" height="96" rx="24" fill="url(#hg1)"/>
<text x="48" y="62" text-anchor="middle" font-family="ui-rounded, 'Segoe UI', sans-serif" font-size="42" font-weight="900" fill="#ffffff">A</text>
</g>
<g transform="translate(414 84)">
<rect width="96" height="96" rx="24" fill="url(#hg3)"/>
<text x="48" y="62" text-anchor="middle" font-family="ui-rounded, 'Segoe UI', sans-serif" font-size="42" font-weight="900" fill="#ffffff">B</text>
</g>

<!-- character -->
<g transform="translate(196 96)">
  <!-- headphones band -->
  <path d="M44 96 Q64 24 128 24 Q192 24 212 96" fill="none" stroke="#8b5cf6" stroke-width="16" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="128" cy="118" r="58" fill="#ffd9b3"/>
  <!-- hair -->
  <path d="M70 116 Q64 66 100 52 Q120 44 132 48 Q146 40 160 54 Q192 66 186 116 Q150 96 128 98 Q106 96 70 116 Z" fill="#4b2e1e"/>
  <circle cx="128" cy="52" r="18" fill="#4b2e1e"/>
  <!-- eyes -->
  <circle cx="104" cy="126" r="5" fill="#2d1b12"/><circle cx="152" cy="126" r="5" fill="#2d1b12"/>
  <circle cx="106" cy="124" r="1.8" fill="#ffffff"/><circle cx="154" cy="124" r="1.8" fill="#ffffff"/>
  <!-- smile -->
  <path d="M110 146 Q128 162 146 146" fill="none" stroke="#2d1b12" stroke-width="4" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="92" cy="142" r="8" fill="#ffb38a" opacity="0.7"/><circle cx="164" cy="142" r="8" fill="#ffb38a" opacity="0.7"/>
  <!-- ear cups -->
  <rect x="66" y="100" width="26" height="52" rx="13" fill="#7c3aed"/>
  <rect x="164" y="100" width="26" height="52" rx="13" fill="#7c3aed"/>
  <rect x="72" y="108" width="14" height="20" rx="7" fill="#c4b5fd"/>
  <rect x="170" y="108" width="14" height="20" rx="7" fill="#c4b5fd"/>
  <!-- torso -->
  <path d="M64 196 Q64 170 96 166 L160 166 Q192 170 192 196 L204 250 Q192 258 172 252 L160 196 Q160 224 128 224 Q96 224 96 196 L84 252 Q64 258 52 250 Z" fill="url(#hg2)"/>
  <!-- arm left holding phone -->
  <path d="M76 200 Q40 216 44 258 Q46 274 60 272" fill="none" stroke="#8b5cf6" stroke-width="22" stroke-linecap="round"/>
  <!-- phone -->
  <g transform="translate(30 240)">
    <rect width="74" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="8" y="10" width="58" height="10" rx="5" fill="#e0e7ff"/>
    <rect x="8" y="30" width="40" height="8" rx="4" fill="#c7d2fe"/>
    <rect x="8" y="46" width="58" height="26" rx="8" fill="#f3f4ff"/>
    <circle cx="52" cy="59" r="8" fill="#6d5efc"/>
    <rect x="8" y="80" width="58" height="6" rx="3" fill="#ddd6fe"/>
    <rect x="8" y="92" width="34" height="6" rx="3" fill="#e0e7ff"/>
  </g>
  <!-- arm right -->
  <path d="M180 200 Q216 214 210 250 Q206 268 192 268" fill="none" stroke="#7c3aed" stroke-width="20" stroke-linecap="round"/>
</g>

<!-- audio waveform (bottom left) -->
<g transform="translate(60 300)">
<rect x="0" y="14" width="8" height="26" rx="4" fill="#22d3ee"/><rect x="14" y="4" width="8" height="46" rx="4" fill="#22d3ee"/>
<rect x="28" y="20" width="8" height="14" rx="4" fill="#22d3ee"/><rect x="42" y="8" width="8" height="38" rx="4" fill="#22d3ee"/>
<rect x="56" y="16" width="8" height="22" rx="4" fill="#22d3ee"/>
</g>

<!-- floating star / sparkles -->
<g transform="translate(356 232)"><circle r="30" fill="#fbbf24" opacity="0.18"/></g>
<g transform="translate(404 250)"><path d="M12 0l2.6 6.6L22 9l-6.6 2.6L12 18l-2.6-6.6L2 9l6.6-2.6z" fill="#f59e0b"/></g>
<g transform="translate(466 300)"><path d="M10 0l2.2 5.5L18 8l-5.8 2.2L10 16l-2.2-5.8L2 8l5.8-2.2z" fill="#8b5cf6"/></g>

<!-- book at bottom right -->
<g transform="translate(388 330)">
<path d="M0 12 C10 4 26 4 36 12 L36 58 C26 50 10 50 0 58 Z" fill="url(#hg2)"/>
<path d="M36 12 C46 4 62 4 72 12 L72 58 C62 50 46 50 36 58 Z" fill="#a78bfa"/>
<path d="M12 16 C20 12 28 12 34 16 M12 24 C20 20 28 20 34 24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
</g>
</svg>